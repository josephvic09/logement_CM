# Déploiement Render : un service web (HTTP + WebSocket), base PostgreSQL hébergée chez Neon.
# Les variables marquées « sync: false » sont à saisir dans le tableau de bord Render.
services:
  - type: web
    name: logementcm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed
    startCommand: daphne -b 0.0.0.0 -p $PORT logement_cm.asgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL  # chaîne de connexion Neon (postgresql://...?sslmode=require)
        sync: false
      - key: SEED_MOT_DE_PASSE  # mot de passe des comptes de démo (visible dans l'onglet Environment)
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HRSKILLS_BASE_URL
        value: https://api.hrskills-pay.com
      - key: HRSKILLS_CLE_PUBLIQUE
        sync: false
      - key: HRSKILLS_CLE_SECRETE
        sync: false
      - key: HRSKILLS_WEBHOOK_SECRET
        sync: false
