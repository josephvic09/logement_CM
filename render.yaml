# Déploiement Render : un service web (HTTP + WebSocket) et une base PostgreSQL.
# Les variables marquées « sync: false » sont à saisir dans le tableau de bord Render.
services:
  - type: web
    name: logementcm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT logement_cm.asgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: logementcm-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CAMPAY_BASE_URL
        value: https://demo.campay.net/api
      - key: CAMPAY_TOKEN
        sync: false

databases:
  - name: logementcm-db
    databaseName: logementcm
    user: logementcm
    plan: free
